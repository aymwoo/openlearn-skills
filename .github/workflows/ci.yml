name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 模板与文档一致性（零依赖，最快反馈）────────────────────────────
  self-check:
    name: 模板 / 文档一致性自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check-templates.sh
        run: bash openlearn-next-plugin-dev/scripts/check-templates.sh

  # ── 2. 与官方 CLI 脚手架比对（发布版 SDK 为基线）─────────────────────
  scaffold-diff:
    name: 与官方脚手架比对（npm 发布版）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 安装官方 SDK（内含 scaffold/templates）
        working-directory: openlearn-next-plugin-dev
        run: npm i --no-save @openlearn/plugin-sdk@latest
      - name: diff-official-scaffold.sh
        run: |
          bash openlearn-next-plugin-dev/scripts/diff-official-scaffold.sh \
            "$(pwd)/openlearn-next-plugin-dev" \
            "$(pwd)/openlearn-next-plugin-dev/node_modules/@openlearn/plugin-sdk/scaffold/templates"

  # ── 3. 三套模板真实构建 + 类型校验 ────────────────────────────────────
  build-verify:
    name: 模板真实构建 + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 安装 SDK 与类型检查器
        working-directory: openlearn-next-plugin-dev
        run: npm i --no-save @openlearn/plugin-sdk@latest typescript@~5.8.0
      - name: verify-templates-build.sh
        run: bash openlearn-next-plugin-dev/scripts/verify-templates-build.sh

  # ── 4. 平台仓库 HEAD 的前瞻性比对（不阻塞）─────────────────────────────
  #     平台 main 可能已包含尚未发布的模板变更；这里提前预警，等 SDK 发版后再落到阻塞项。
  platform-head-diff:
    name: 与平台仓库 HEAD 比对（预警）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: 拉取平台仓库
        run: |
          git clone --depth 1 https://github.com/aymwoo/OpenLearn-Next-V2.git /tmp/platform
      - name: diff-official-scaffold.sh（对 HEAD 模板，预警模式）
        env:
          DIFF_ADVISORY: '1'
        run: |
          bash openlearn-next-plugin-dev/scripts/diff-official-scaffold.sh \
            "$(pwd)/openlearn-next-plugin-dev" /tmp/platform

  # ── 5. 平台契约漂移预警（不阻塞）─────────────────────────────────────
  #     契约快照直连平台 docs/agent/contracts/。平台契约会随源码演进而变，
  #     漂移只说明「可以水合一次」，不代表 skill 产物有错（发布版 API 面
  #     由 scaffold-diff / build-verify 两个阻塞 job 把关）。
  #     故与 platform-head-diff 同为预警：平台改一次契约不应卡住与契约无关的 PR。
  contract-drift:
    name: 平台契约漂移预警
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: 拉取平台仓库（契约真源）
        run: git clone --depth 1 https://github.com/aymwoo/OpenLearn-Next-V2.git "$RUNNER_TEMP/platform"
      - name: hydrate-contracts.sh --check（预警模式，不阻塞）
        env:
          PLATFORM_REPO: ${{ runner.temp }}/platform
        run: |
          set +e
          bash openlearn-next-plugin-dev/scripts/hydrate-contracts.sh --check
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=平台契约漂移::平台 docs/agent/contracts/ 与 skill 快照存在漂移（不影响发布）。请运行 bash scripts/hydrate-contracts.sh 水合。"
          fi
          exit 0
